services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghygen:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: sqlite
    volumes:
      - sqlite-data:/var/www/html/database
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite-data:
